services:
  app:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://pack:pack@db:5432/pack
      # Values come from .env when present (docker compose reads it for interpolation)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pack
      POSTGRES_PASSWORD: pack
      POSTGRES_DB: pack
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pack -d pack']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
