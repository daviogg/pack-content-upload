# Fly.io configuration: https://fly.io/docs/reference/configuration/
app = "pack-content-upload"
primary_region = "ams"

[build]
  [build.args]
    # Public URL, baked into the build for the CSRF check on form posts
    ORIGIN = "https://pack-content-upload.fly.dev"

[env]
  PORT = "3000"
  BODY_SIZE_LIMIT = "209715200"
  STORAGE_DRIVER = "s3"
  S3_REGION = "auto"
  # DATABASE_URL, S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY are secrets

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
